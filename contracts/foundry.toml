[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
# Uniswap v4-core requires Cancun (transient storage).
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
via_ir = true
# Bare `forge test` MemoryOOG without this — CI historically passed --gas-limit
# 3000000000 on the unit/vector + fuzz buckets; pin it in-profile so a fresh
# clone is green without remembering the flag.
# M5 ladder: road at-bar clearAll ~3.3B; Phase 4 gas@300 actives clearAll setup ~13.9B.
gas_limit = 20000000000
fuzz = { runs = 2048 }
invariant = { runs = 512, depth = 64 }
extra_output = ["storageLayout"]
fs_permissions = [
    { access = "read-write", path = "./test/vectors" },
    { access = "read", path = "./test/fixtures" },
    { access = "read-write", path = "../deploys/official" }
]
# FEECHAIN Phase 1 — pinned Uniswap v4 (do not float):
#   v4-core      @ 46c6834698c48bc4a463a86d8420f4eb1d7f3b75
#   v4-periphery @ 545a5d2a87228167edde48f3b9eda122d1e3c4d6
# Remappings force our v4-core pin over periphery's nested submodule.

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
