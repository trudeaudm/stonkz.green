name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reference-oracle:
    name: Reference engine (19 checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run reference oracle
        run: node reference/engine.test.js
      - name: Generate fuzz vectors (fixed seed 4663)
        run: node reference/fuzz-vectors.js 4663

  foundry:
    name: Foundry build + unit/vector suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to the version CI resolved on main @ 94ad73c (2026-07-26).
          # Local may skew (e.g. 1.6.0-rc1); known — prefer CI as source of truth.
          version: "v1.7.1"
      - name: Generate fuzz vectors (fixed seed 4663)
        run: node reference/fuzz-vectors.js 4663
      - name: Install deps, build, unit+vector tests
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std --no-git
          forge install vectorized/solady --no-git
          forge build
          # Live tree only: Express + Ladder + vault + FEECHAIN.
          # Legacy waterfill StonkzAuction lives in contracts/legacy/ (off CI).
          forge test -vv
